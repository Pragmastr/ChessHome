<style>
  /* Все стили страницы лежат под префиксом .vsc — с остальным сайтом не пересекаются */

    --vsc-card: var(--bg-card, #1e2028);
    --vsc-card2: var(--bg-secondary, #161820);
    --vsc-border: var(--border, #2e3040);
    --vsc-accent: var(--accent, #c9a84c);
    --vsc-text: var(--text-primary, #e8e9f0);
    --vsc-muted: var(--text-secondary, #8a8ea8);
    --vsc-green: var(--green, #4caf72);
    --vsc-red: var(--red, #e05555);
    --bs: min(calc(100vh - 200px), 640px);
    box-sizing: border-box;
    min-height: 100vh;
    padding: 72px 16px 32px;
    color: var(--vsc-text);
    background: var(--vsc-bg);
    font-family: var(--font-body, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif);
  }
  .vsc *, .vsc *::before, .vsc *::after { box-sizing: border-box; }
  .vsc-layout {
    max-width: 1080px; margin: 0 auto;
    display: grid; grid-template-columns: var(--bs) minmax(320px, 400px);
    gap: 24px; justify-content: center; align-items: start;
  }
  @media (max-width: 960px) {
    .vsc { --bs: min(calc(100vw - 24px), 560px); padding-top: 68px; }

  }

  /* ── Полоски игроков ─────────────────────────────── */
  .vsc-strip {
    height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 4px;
  }
  .vsc-pname { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vsc-plevel { font-size: 12px; color: var(--vsc-muted); white-space: nowrap; }
  .vsc-cap { font-size: 17px; line-height: 1; letter-spacing: -2px; color: var(--vsc-muted); min-height: 17px; flex: 1; overflow: hidden; white-space: nowrap; }
  .vsc-cap .adv { font-size: 12px; letter-spacing: 0; margin-left: 6px; font-weight: 700; }
  .vsc-clock {
    margin-left: auto; min-width: 84px; text-align: center; padding: 5px 10px; border-radius: 8px;
    font: 700 20px/1.2 ui-monospace, 'SF Mono', Consolas, monospace;
    background: var(--vsc-card2); border: 1px solid var(--vsc-border); color: var(--vsc-muted);
  }
  .vsc-clock.active { color: #fff; background: #2b3a2e; border-color: var(--vsc-green); }
  .vsc-clock.low { color: #fff; background: #5a2420; border-color: var(--vsc-red); }

  /* ── Доска ───────────────────────────────────────── */
  .vsc-boardwrap { position: relative; width: var(--bs); }
  .vsc-board {
    width: var(--bs); height: var(--bs); display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    border-radius: 6px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: default; }
  .sq.light { background-color: var(--board-light, #f0d9b5); }
  .sq.dark  { background-color: var(--board-dark, #b58863); }
  .sq.last { box-shadow: inset 0 0 0 100px var(--board-move, rgba(201,168,76,0.35)); }
  .sq.sel  { box-shadow: inset 0 0 0 100px var(--board-highlight, rgba(201,168,76,0.6)); }
  .sq.check.light, .sq.check.dark { background-image: radial-gradient(circle, var(--board-check, rgba(220,60,60,0.7)) 0%, rgba(220,60,60,0.45) 45%, rgba(220,60,60,0) 78%); }
  .sq::before { /* подписи вертикалей/горизонталей */
    content: attr(data-r); position: absolute; top: 2px; left: 3px; font-size: calc(var(--bs) / 48);
    font-weight: 700; pointer-events: none; z-index: 1;
  }
  .sq::after {
    content: attr(data-f); position: absolute; bottom: 1px; right: 3px; font-size: calc(var(--bs) / 48);
    font-weight: 700; pointer-events: none; z-index: 1;
  }
  .sq.light::before, .sq.light::after { color: var(--board-dark, #b58863); }
  .sq.dark::before, .sq.dark::after { color: var(--board-light, #f0d9b5); }
  .vsc-board.interactive .sq.mine { cursor: grab; }
  .sq .dotm { position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(20,60,20,0.38); pointer-events: none; }
  .sq .capm { position: absolute; inset: 4%; border-radius: 50%; border: calc(var(--bs) / 90) solid rgba(20,60,20,0.38); pointer-events: none; }
  img.pc { width: 88%; height: 88%; position: relative; z-index: 2; pointer-events: none; -webkit-user-drag: none; }

  .sq.drag-src img.pc { opacity: 0.25; }
  .vsc-cap img { width: 20px; height: 20px; margin-right: -6px; vertical-align: middle; }

  /* Превращение пешки */

    position: absolute; inset: 0; z-index: 20; background: rgba(8,8,14,0.72); border-radius: 6px;

  }
  .vsc-promo.open { display: flex; }
  .vsc-promo-box { background: var(--vsc-card); border: 1px solid var(--vsc-accent); border-radius: 14px; padding: 14px; display: flex; gap: 8px; }

    width: calc(var(--bs) / 8 * 1.1); height: calc(var(--bs) / 8 * 1.1); border-radius: 10px; cursor: pointer;
    background: var(--board-light, #f0d9b5); border: 2px solid transparent; padding: 4px; display: flex; align-items: center; justify-content: center;
  }
  .vsc-promo-box button img { width: 100%; height: 100%; }
  .vsc-promo-box button:hover { border-color: var(--vsc-accent); }

  /* ── Правая панель ───────────────────────────────── */
  .vsc-panel {
    background: var(--vsc-card); border: 1px solid var(--vsc-border); border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35); padding: 18px;
  }
  .vsc-panel[hidden] { display: none; }
  .vsc-h1 { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
  .vsc-sub { font-size: 13px; color: var(--vsc-muted); margin: 0 0 14px; line-height: 1.45; }
  .vsc-label { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--vsc-muted); margin: 16px 0 8px; }

    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; cursor: pointer;

  }
  .vsc-bot:hover { border-color: rgba(201,168,76,0.5); }

  .vsc-bot.sel .vsc-bot-lvl { background: var(--vsc-accent); color: #1a1405; }
  .vsc-bot-desc { font-size: 12px; color: var(--vsc-muted); margin-top: 2px; line-height: 1.35; }
  .vsc-dots { font-size: 10px; letter-spacing: 2px; color: var(--vsc-accent); flex-shrink: 0; }

  .vsc-tcrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .vsc-tcname { font-size: 12px; color: var(--vsc-muted); width: 52px; flex-shrink: 0; }
  .vsc-chip {
    cursor: pointer; padding: 6px 12px; border-radius: 9px; font: 700 13px/1 inherit; color: inherit;
    background: var(--vsc-card2); border: 1px solid var(--vsc-border);
  }
  .vsc-chip:hover { border-color: rgba(201,168,76,0.5); }
  .vsc-chip.sel { background: var(--vsc-accent); border-color: var(--vsc-accent); color: #1a1405; }

  .vsc-colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .vsc-color {
    cursor: pointer; padding: 10px 6px; border-radius: 12px; color: inherit; font: inherit; font-size: 12.5px; font-weight: 700;
    background: var(--vsc-card2); border: 1px solid var(--vsc-border); display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .vsc-color .ci { font-size: 26px; line-height: 1; height: 30px; display: flex; align-items: center; }
  .vsc-color .ci img { width: 30px; height: 30px; }
  .vsc-color:hover { border-color: rgba(201,168,76,0.5); }
  .vsc-color.sel { border-color: var(--vsc-accent); background: rgba(201,168,76,0.10); }

  .vsc-btn {
    cursor: pointer; border: none; border-radius: 12px; font: inherit; font-weight: 800; font-size: 15px; color: #1a1405;
    padding: 13px 16px; width: 100%; background: linear-gradient(135deg, #e0bd5a, #c9a84c); transition: transform .08s, filter .12s;
  }
  .vsc-btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .vsc-btn:disabled { opacity: 0.6; cursor: wait; }
  .vsc-btn.sec {
    background: var(--vsc-card2); color: var(--vsc-text); border: 1px solid var(--vsc-border); font-size: 13px; padding: 9px 10px; font-weight: 700;
  }
  .vsc-btn.sec:hover:not(:disabled) { border-color: rgba(201,168,76,0.5); transform: none; filter: none; }
  .vsc-btn.danger { color: #ff9a93; }
  .vsc-btn.danger.armed { background: #5a2420; color: #fff; border-color: var(--vsc-red); }
  .vsc-start { margin-top: 18px; }
  .vsc-note { font-size: 12px; color: var(--vsc-muted); margin-top: 10px; line-height: 1.45; text-align: center; }
  .vsc-error { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.45;

  .vsc-error.show { display: block; }

  .vsc-status { font-size: 15px; font-weight: 700; padding: 10px 12px; border-radius: 10px; background: var(--vsc-card2); border: 1px solid var(--vsc-border); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .vsc-status.think::after { content: ''; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--vsc-accent); border-top-color: transparent; animation: vscspin .8s linear infinite; margin-left: auto; }
  .vsc-status.win  { border-color: var(--vsc-green); background: rgba(76,175,125,0.12); }

  .vsc-moves .no { color: var(--vsc-muted); padding: 4px 4px; text-align: right; font-size: 12.5px; }
  .vsc-moves .mv { padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .vsc-moves .mv:hover { background: rgba(255,255,255,0.07); }
  .vsc-moves .mv.cur { background: var(--vsc-accent); color: #1a1405; }
  .vsc-moves .empty { grid-column: 1 / -1; color: var(--vsc-muted); text-align: center; padding: 20px 0; font-size: 13px; }
  .vsc-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
  .vsc-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .vsc-actions .full { grid-column: 1 / -1; }
  .vsc-actions[hidden], .vsc-btn[hidden] { display: none; }
  .vsc-vs { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; color: var(--vsc-muted); }
  .vsc-vs b { color: var(--vsc-text); }
</style>

  function clearError() { $('#setup-error').classList.remove('show'); }

  async function startGame(forceHuman) {
    clearError();
    var bot = C.BOTS[settings.bot], btn = $('#btn-start');
    if (bot.engine === 'stockfish') {
      btn.disabled = true; btn.textContent = 'Загрузка Stockfish 16…';
      try { await sfInit(); }
      catch (err) {
        btn.disabled = false; btn.textContent = 'Начать игру';
        showError('Не удалось загрузить Stockfish 16. Проверьте, что файлы движка (<code>.js</code> и <code>.wasm</code>) лежат на сервере. Пробовал пути:<br><code>' +
          (err.tried || SF_URLS).join('</code><br><code>') + '</code><br>Выберите другого соперника или поправьте <code>SF_URLS</code> в vs-computer.html.');
        return;
      }
      btn.disabled = false; btn.textContent = 'Начать игру';
    }
    var tc = findTc(settings.tc);
    var human = forceHuman !== undefined ? forceHuman : (settings.color === 'w' ? WHITE : settings.color === 'b' ? BLACK : (Math.random() < 0.5 ? WHITE : BLACK));
    abortBot(); token++;
    if (sf.w) { sf.w.postMessage('ucinewgame'); }
    G = {
      botId: settings.bot, human: human, tcId: tc.id,
      inc: tc.inc, clocks: tc.base ? [tc.base * 1000, tc.base * 1000] : null, running: false, lastTs: 0,
      pos: new C.Position(), moves: [], sans: [], fens: [C.START_FEN], lastMoves: [null], view: 0,
      legal: null, reps: {}, over: false, result: '*', thinking: false, startedAt: new Date()
    };
    G.legal = G.pos.legalMoves();
    G.reps[G.pos.repetitionKey()] = 1;
    flipped = false; sel = null; drag = null; closePromo();
    $('#panel-setup').hidden = true; $('#panel-game').hidden = false;
    $('#actions-live').hidden = false; $('#actions-over').hidden = true;
    $('#btn-undo').hidden = !!G.clocks;
    $('#game-vs').innerHTML = '<span style="font-size:22px">' + bot.icon + '</span><span>Против <b>' + esc(bot.name) + '</b> · ' + esc(bot.level) + ' · ' + (tc.base ? tc.id : 'без часов') + '</span>';
    render(); refreshStatus();
    if (G.pos.side !== G.human) botMove();
  }

  function toSetup() {
    abortBot(); token++;
    G = null; sel = null; closePromo();
    previewColor = settings.color === 'b' ? BLACK : WHITE; flipped = false;
    $('#panel-game').hidden = true; $('#panel-setup').hidden = false;
    render();
  }

  $('#btn-start').onclick = function () { startGame(); };
  $('#btn-newgame').onclick = toSetup;
  $('#btn-rematch').onclick = function () { startGame(G.human ^ 1); };
  $('#btn-flip').onclick = $('#btn-flip2').onclick = function () { flipped = !flipped; render(); };

  var resignTimer = null;
  $('#btn-resign').onclick = function () {
    var b = $('#btn-resign');
    if (!G || G.over) return;
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = 'Нажмите ещё раз, чтобы сдаться';
      resignTimer = setTimeout(resetResign, 3000); return;
    }
    resetResign();
    finish(G.human === WHITE ? '0-1' : '1-0', 'Вы сдались');
  };
  function resetResign() { clearTimeout(resignTimer); var b = $('#btn-resign'); b.classList.remove('armed'); b.textContent = '🏳 Сдаться'; }

  $('#btn-undo').onclick = function () {
    if (!G || G.over || G.clocks) return;
    var n = G.moves.length, minLen = G.human === WHITE ? 0 : 1, botTurn = G.pos.side !== G.human;
    // наш ход: откатываем свой ход и ответ бота (−2); бот ещё думает: откатываем только свой последний ход (−1)
    var target = botTurn ? n - 1 : n - 2;
    if (target < minLen) return;
    if (botTurn) { abortBot(); token++; G.thinking = false; }
    rewindTo(target);
  };
  function rewindTo(len) {
    G.moves.length = len; G.sans.length = len; G.fens.length = len + 1; G.lastMoves.length = len + 1;
    G.pos.setFEN(G.fens[len]); G.view = len; G.legal = G.pos.legalMoves();
    G.reps = {}; G.fens.forEach(function (f) { var k = f.split(' ').slice(0, 4).join(' '); G.reps[k] = (G.reps[k] || 0) + 1; });
    sel = null; render(); refreshStatus();
  }

  // Навигация по ходам
  function goView(v) {
    if (!G) return;
    v = Math.max(0, Math.min(G.fens.length - 1, v));
    if (v === G.view) return;
    G.view = v; sel = null; render();
  }
  $('#nav-first').onclick = function () { if (G) goView(0); };
  $('#nav-prev').onclick = function () { if (G) goView(G.view - 1); };
  $('#nav-next').onclick = function () { if (G) goView(G.view + 1); };
  $('#nav-last').onclick = function () { if (G) goView(G.fens.length - 1); };
  $('#moves').addEventListener('click', function (e) { var t = e.target.closest('.mv'); if (t) goView(+t.dataset.v); });
  document.addEventListener('keydown', function (e) {
    if (!G || /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) return;
    if (e.key === 'ArrowLeft') { goView(G.view - 1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { goView(G.view + 1); e.preventDefault(); }
    else if (e.key === 'Home') { goView(0); e.preventDefault(); }
    else if (e.key === 'End') { goView(G.fens.length - 1); e.preventDefault(); }
  });

  // PGN
  $('#btn-pgn').onclick = function () {
    if (!G) return;
    var bot = C.BOTS[G.botId], d = G.startedAt, pad = function (n) { return String(n).padStart(2, '0'); };
    var wName = G.human === WHITE ? userName : bot.name, bName = G.human === BLACK ? userName : bot.name;
    var tc = findTc(G.tcId);
    var pgn = '[Event "Игра с компьютером (Chess Home)"]\n[Site "Chess Home"]\n[Date "' + d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + '"]\n' +
      '[White "' + wName + '"]\n[Black "' + bName + '"]\n[Result "' + G.result + '"]\n[TimeControl "' + (tc.base ? tc.base + (tc.inc ? '+' + tc.inc : '') : '-') + '"]\n\n';
    var body = '';
    for (var i = 0; i < G.sans.length; i++) body += (i % 2 === 0 ? (i / 2 + 1) + '. ' : '') + G.sans[i] + ' ';
    pgn += body + G.result;
    copyText(pgn).then(function () {
      var b = $('#btn-pgn'), old = b.textContent; b.textContent = '✓ Скопировано';
      setTimeout(function () { b.textContent = old; }, 1600);
    });
  };
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove();
  }

  // ── Панель настроек ───────────────────────────────────────────────────────
  function buildSetup() {
    var bots = $('#bots'); bots.innerHTML = '';
    Object.keys(C.BOTS).forEach(function (id) {
      var b = C.BOTS[id], btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'vsc-bot'; btn.dataset.id = id;
      var dots = ''; for (var i = 1; i <= 5; i++) dots += '<span class="' + (i <= b.stars ? '' : 'off') + '">●</span>';
      btn.innerHTML = '<span class="vsc-bot-ic">' + b.icon + '</span>' +
        '<span class="vsc-bot-main"><span class="vsc-bot-name">' + esc(b.name) + '<span class="vsc-bot-lvl">' + esc(b.level) + '</span></span>' +
        '<span class="vsc-bot-desc">' + esc(b.desc) + '</span></span><span class="vsc-dots">' + dots + '</span>';
      btn.onclick = function () { settings.bot = id; saveSettings(); syncSetupUi(); render(); clearError(); };
      bots.appendChild(btn);
    });
    var tcs = $('#tcs'); tcs.innerHTML = '';
    TIME_CONTROLS.forEach(function (g) {
      var row = document.createElement('div'); row.className = 'vsc-tcrow';
      row.innerHTML = '<span class="vsc-tcname">' + g.group + '</span>';
      g.items.forEach(function (it) {
        var c = document.createElement('button'); c.type = 'button'; c.className = 'vsc-chip'; c.dataset.id = it.id;
        c.textContent = it.label || it.id;
        c.onclick = function () { settings.tc = it.id; saveSettings(); syncSetupUi(); };
        row.appendChild(c);
      });
      tcs.appendChild(row);
    });
    document.querySelectorAll('#colors .vsc-color').forEach(function (b) {
      b.onclick = function () {
        settings.color = b.dataset.c; saveSettings(); syncSetupUi();
        previewColor = settings.color === 'b' ? BLACK : WHITE; flipped = false; render();
      };
    });
    syncSetupUi();
  }
  function syncSetupUi() {
    document.querySelectorAll('.vsc-bot').forEach(function (b) { b.classList.toggle('sel', b.dataset.id === settings.bot); });
    document.querySelectorAll('.vsc-chip').forEach(function (b) { b.classList.toggle('sel', b.dataset.id === settings.tc); });
    document.querySelectorAll('#colors .vsc-color').forEach(function (b) { b.classList.toggle('sel', b.dataset.c === settings.color); });
  }

  // ── Запуск ────────────────────────────────────────────────────────────────
  previewColor = settings.color === 'b' ? BLACK : WHITE;
  buildSetup();
  render();

})();
</script>
</body>
